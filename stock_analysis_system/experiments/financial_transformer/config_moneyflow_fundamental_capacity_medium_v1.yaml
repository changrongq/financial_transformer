databases:
  trade_db: "../../../stock_history.db"
  market_cap_db: "../../../market_cap_full.db"

results_dir: "results/moneyflow_fundamental_capacity_medium_v1"
artifacts_dir: "artifacts/moneyflow_fundamental_capacity_medium_v1"

experiment:
  stock_pool: []
  layer_filter: "micro"
  max_stocks: 200
  feature_cols:
    - "open"
    - "close"
    - "high"
    - "low"
    - "volume"
    - "amount"
    - "turnover_rate"
    - "return_1d"
    - "return_5d"
    - "return_20d"
    - "volatility_20d"
    - "amount_ma5_ma20"
    - "volume_ma5_ma20"
    - "rsi_14"
    - "macd"
    - "macd_signal"
    - "trend_strength"
    - "close_to_high"
    - "close_to_low"
    - "gap_open"
    - "market_cap_ratio"
    - "month_sin"
    - "month_cos"
    - "net_mf_amount_ratio"
    - "net_lg_amount_ratio"
    - "net_elg_amount_ratio"
    - "net_mf_ratio_5d"
    - "net_lg_ratio_5d"
    - "net_elg_ratio_5d"
    - "pe_ttm"
    - "pb"
    - "ps_ttm"
    - "dividend_ttm"
    - "is_tech"
    - "is_consumer"
    - "is_medicine"
    - "is_finance"
    - "is_cycle"
    - "is_kcb_cyb"
    - "listed_days"
  prediction_horizon: 5
  target_return_threshold: 0.03

multitask:
  short_horizon: 5
  short_threshold: 0.03
  hold_days: 45
  take_profit_threshold: 0.12
  stop_loss_threshold: -0.06
  validation_metric: "signal_future_spearman"
  regression_loss_beta: 0.05
  short_up_ranking_weight: 0.35
  short_up_ranking_min_return_gap: 0.02
  short_up_ranking_same_date_only: true
  short_up_ranking_max_pairs_per_batch: 2048
  task_weights:
    short_up: 1.2
    take_profit: 1.0
    stop_loss: 1.0
    max_gain: 0.5
    max_drawdown: 0.35

splits:
  train_end: "2025-09-30"
  val_end: "2025-12-31"
  test_end: "2026-03-04"

model:
  seq_len: 60
  d_model: 96
  nhead: 6
  num_layers: 3
  dim_feedforward: 384
  dropout: 0.1
  ffn_type: "mlp"
  position_encoding: "sinusoidal"

training:
  batch_size: 28
  epochs: 70
  learning_rate: 0.00025
  weight_decay: 0.01
  early_stopping_patience: 12
  gradient_clip: 1.0
  label_smoothing: 0.05
  max_zero_turnover_fill_ratio: 0.02
  device: "cuda"